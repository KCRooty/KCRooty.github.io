*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}

.back span{color:#5d5245}

.win{position:relative;z-index:1;display:flex;flex-direction:column;width:min(980px,calc(100vw - 16px));height:min(760px,calc(100dvh - 58px));background:#ECE9D8;border:1px solid #0831D9;border-top:0;border-radius:8px 8px 0 0;box-shadow:0 0 0 1px #001EA0,0 18px 40px rgba(0,0,0,.6);overflow:hidden}

.tb .ico{width:16px;height:16px;flex:none}
.tb .ttl{flex:1;font:bold 13px/1 "Trebuchet MS",Tahoma,sans-serif;text-shadow:1px 1px 0 #0A1883;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wb{width:21px;height:21px;border:1px solid #fff;border-radius:3px;background:linear-gradient(180deg,#3C8CF3,#1A64E0 60%,#2A73EA);display:grid;place-items:center;cursor:pointer;padding:0;flex:none}
.wb:hover{filter:brightness(1.15)}
.wb.x{background:linear-gradient(180deg,#E99179,#D2502A 55%,#C7401C)}
.wb svg{width:11px;height:11px}

.mb>div{position:relative}
.mb>div>button{height:20px;padding:0 7px;border:0;background:none;font:inherit;color:#000;cursor:default}
.mb>div.open>button,.mb>div>button:hover{background:#316AC5;color:#fff}
.menu{display:none;position:absolute;left:0;top:20px;min-width:220px;background:#fff;border:1px solid #ACA899;box-shadow:2px 2px 3px rgba(0,0,0,.35);padding:2px;z-index:30}
.mb>div.open>.menu{display:block}
.mi{display:flex;align-items:center;width:100%;height:21px;padding:0 10px 0 22px;border:0;background:none;font:inherit;color:#000;text-align:left;cursor:default;position:relative;white-space:nowrap}
.mi:hover:not(:disabled),.mi.hot{background:#316AC5;color:#fff}
.mi:disabled{color:#ACA899}
.mi .k{margin-left:auto;padding-left:24px}
.mi.on::before{content:"";position:absolute;left:8px;top:5px;width:8px;height:8px;background:currentColor;clip-path:polygon(14% 44%,0 59%,37% 100%,100% 18%,86% 4%,37% 72%)}
.sep{height:1px;background:#ACA899;margin:3px 1px}
.sub{position:relative}
.sub>.menu{left:100%;top:-3px}
.sub:hover>.menu,.sub.open>.menu{display:block}
.sub>.mi::after{content:"▸";margin-left:auto;padding-left:16px}

.body{flex:1;display:flex;min-height:0}

.tbtn{width:25px;height:25px;border:1px solid transparent;background:#ECE9D8;display:grid;place-items:center;padding:0;cursor:default}
.tbtn svg{width:16px;height:16px;shape-rendering:crispEdges}
.tbtn:hover{border-color:#fff #716F64 #716F64 #fff}
.tbtn.on{border-color:#716F64 #fff #fff #716F64;background:repeating-conic-gradient(#fff 0 25%,#ECE9D8 0 50%) 0 0/2px 2px}
.opts{margin-top:6px;width:44px;min-height:68px;border:1px solid;border-color:#716F64 #fff #fff #716F64;background:#ECE9D8;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:2px}
.opts.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px}
.op{width:100%;min-height:12px;border:0;background:none;display:grid;place-items:center;padding:1px;cursor:default}
.op.on{background:#316AC5}
.op.on svg *{fill:#fff;stroke:#fff}
.op svg{display:block;shape-rendering:crispEdges}
.ws{flex:1;position:relative;overflow:auto;background:#808080;touch-action:none}
.page{position:relative;margin:3px;display:inline-block}
.page canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges}
#ov{position:absolute;left:0;top:0;pointer-events:none}
.page.grid::after{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(to right,rgba(128,128,128,.6) 1px,transparent 1px),linear-gradient(to bottom,rgba(128,128,128,.6) 1px,transparent 1px);background-size:var(--z) var(--z)}
.hd{position:absolute;width:5px;height:5px;background:#000080;border:1px solid #fff}
.hd.r{right:-6px;top:calc(50% - 3px);cursor:ew-resize}.hd.b{bottom:-6px;left:calc(50% - 3px);cursor:ns-resize}.hd.rb{right:-6px;bottom:-6px;cursor:nwse-resize}
.rs{position:absolute;left:0;top:0;border:1px dashed #000;pointer-events:none;display:none}
textarea.txt{position:absolute;resize:none;border:1px dashed #000;background:transparent;outline:0;overflow:hidden;padding:0;line-height:1.15;white-space:pre-wrap;z-index:5;-webkit-user-select:text;user-select:text}
/* Paleta */
.cb{display:flex;align-items:center;gap:4px;height:40px;padding:3px 4px;border-top:1px solid #fff;flex:none;background:#ECE9D8}
.cur{position:relative;width:30px;height:32px;border:1px solid;border-color:#716F64 #fff #fff #716F64;background:repeating-conic-gradient(#fff 0 25%,#ECE9D8 0 50%) 0 0/2px 2px;flex:none}
.cur i{position:absolute;width:15px;height:15px;border:1px solid;border-color:#716F64 #fff #fff #716F64;box-shadow:inset 1px 1px 0 #404040}
.cur .fg{left:4px;top:4px;z-index:1}.cur .bg{left:11px;top:12px}
.pal{display:grid;grid-template-columns:repeat(14,16px);grid-template-rows:16px 16px;gap:0}
.pal button{width:16px;height:16px;border:1px solid;border-color:#716F64 #fff #fff #716F64;box-shadow:inset 1px 1px 0 #404040;padding:0;cursor:default}
.sb{display:flex;height:22px;border-top:1px solid #fff;box-shadow:inset 0 1px 0 #ACA899;flex:none;background:#ECE9D8}
.sb>div{display:flex;align-items:center;padding:0 6px;border:1px solid;border-color:#ACA899 #fff #fff #ACA899;margin:2px 1px;white-space:nowrap;overflow:hidden}

.hide{display:none!important}

.fontbar .tg{width:23px;height:22px;border:1px solid transparent;background:none;font:bold 12px Times,serif;cursor:default}
.fontbar .tg.on{border-color:#716F64 #fff #fff #716F64;background:#fff}
.view{position:fixed;inset:0;z-index:200;background:#000;display:none;place-items:center;cursor:none}
.view.on{display:grid}
.view img{image-rendering:pixelated;max-width:none}

  .back{padding:4px 10px}

  .mb>div>button{padding:0 5px}

@media print{body>*{display:none!important}body{background:#fff;overflow:visible;display:block}#printImg{display:block!important;max-width:100%}}

  v.setUint16(0,0x4D42,true);v.setUint32(2,size,true);v.setUint32(10,54,true);v.setUint32(14,40,true);v.setInt32(18,w,true);v.setInt32(22,h,true);v.setUint16(26,1,true);v.setUint16(28,24,true);v.setUint32(34,row*h,true);v.setInt32(38,2835,true);v.setInt32(42,2835,true);
  for(var y=0;y<h;y++){var o=54+(h-1-y)*row;for(var x=0;x<w;x++){var i=(y*w+x)*4;v.setUint8(o++,d[i+2]);v.setUint8(o++,d[i+1]);v.setUint8(o++,d[i])}}
  return new Blob([b],{type:'image/bmp'});
}
function download(c,name,type){
  function go(blob){var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name+'.'+(type==='jpeg'?'jpg':type);document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1000)}
  if(type==='bmp')go(bmp(c));
  else if(type==='jpeg'){var k=mk(c.width,c.height);k[1].fillStyle='#fff';k[1].fillRect(0,0,c.width,c.height);k[1].drawImage(c,0,0);k[0].toBlob(go,'image/jpeg',.92)}
  else c.toBlob(go,'image/png');
}
function save(as,cb){
  commitAll(true);
  if(!as&&fname){var c=flat();download(c,fname,ftype);dirty=false;title();cb&&cb();return}
  dialog(S.svT,'<label>'+S.svName+' <input type="text" id="svN" value="'+esc(fname||S.untitled)+'"></label><label>'+S.svType+' <select id="svT" style="width:190px"><option value="png">PNG (*.png)</option><option value="jpeg">JPEG (*.jpg)</option><option value="bmp">Mapa de bits de 24 bits (*.bmp)</option></select></label>',
    function(){fname=($('svN').value||S.untitled).replace(/[\\/:*?"<>|]/g,'_');ftype=$('svT').value;download(flat(),fname,ftype);dirty=false;title();cb&&cb()});
  setTimeout(function(){$('svT').value=ftype;var n=$('svN');n.focus();n.select()},0);
}
function flat(){if(!sel||!sel.fl)return cv;var k=mk(W,H);k[1].drawImage(cv,0,0);k[1].drawImage(transp(sel.fl),sel.x,sel.y);return k[0]}
function guard(next){

  dialog(S.app,'<p>'+esc(S.ask(fname||S.untitled))+'</p>',null,[[S.yes,function(){save(false,next)}],[S.no,function(){next()}],[S.cancel,null]]);

function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
var dlgOk=null;
function dialog(t,html,ok,btns){
  $('dT').textContent=t;
  btns=btns||(ok?[[S.ok,ok],[S.cancel,null]]:[[S.ok,null]]);
  $('dIn').innerHTML=html+'<div class="btns">'+btns.map(function(b,i){return '<button class="xb" data-i="'+i+'">'+esc(b[0])+'</button>'}).join('')+'</div>';
  $('dIn').querySelectorAll('.xb').forEach(function(b){b.onclick=function(){var f=btns[+b.dataset.i][1];closeDlg();f&&f()}});
  dlgOk=function(){var f=btns[0][1];closeDlg();f&&f()};
  $('dlgbg').classList.add('on');setTimeout(function(){var f=$('dIn').querySelector('input,select,.xb');f&&f.focus()},0);
}
function closeDlg(){$('dlgbg').classList.remove('on');dlgOk=null}
$('dX').onclick=closeDlg;
$('dlgbg').addEventListener('keydown',function(e){if(e.key==='Escape'){e.stopPropagation();closeDlg()}else if(e.key==='Enter'&&dlgOk&&e.target.tagName!=='BUTTON'){e.preventDefault();dlgOk()}});

  function(){var w=+$('aW').value,h=+$('aH').value;if(w>0&&h>0&&(w!==W||h!==H)){commitAll();pushUndo();setSize(w,h,true)}});

  dialog(S.zT,'<p>'+S.zCur+' '+Z*100+'%</p><fieldset><legend>'+S.zTo+'</legend>'+[1,2,4,6,8].map(function(z){return '<label><input type="radio" name="zz" value="'+z+'"'+(z===Z?' checked':'')+'> '+z*100+'%</label>'}).join('')+'</fieldset>',
  function(){var z=document.querySelector('input[name=zz]:checked');if(z)setZoom(+z.value)});

function dHelp(){dialog(S.helpT,'<ul>'+S.helpL.map(function(l){return '<li>'+esc(l)+'</li>'}).join('')+'</ul>')}

/* ═════════════ Menús ═════════════ */
var view={tools:true,colors:true,status:true,text:true};
var M=[
 ['file',[['new','Ctrl+N',newDoc],['open','Ctrl+O',function(){guard(function(){openFile(false)})}],['save','Ctrl+S',function(){save(false)}],['saveas','',function(){save(true)}],'-',['print','Ctrl+P',printImg],'-',['exit','',function(){guard(function(){location.href='/'})}]]],
 ['edit',[['undo','Ctrl+Z',undo,function(){return undoS.length>0}],['redo','Ctrl+Y',redo,function(){return redoS.length>0}],'-',['cut','Ctrl+X',function(){if(copySel())delSel()},function(){return !!sel}],['copy','Ctrl+C',copySel,function(){return !!sel}],['paste','Ctrl+V',function(){if(clip)pasteCanvas(clip)},function(){return !!clip}],['clearsel','Supr',delSel,function(){return !!sel}],['selall','Ctrl+A',selAll],'-',['copyto','',function(){if(sel){commitText();download(sel.fl||selCanvas(),'seleccion','png')}},function(){return !!sel}],['pastefrom','',function(){openFile(true)}]]],
 ['view',[['toolbox','Ctrl+T',function(){view.tools=!view.tools;applyView()},null,function(){return view.tools}],['colorbox','Ctrl+L',function(){view.colors=!view.colors;applyView()},null,function(){return view.colors}],['statusbar','',function(){view.status=!view.status;applyView()},null,function(){return view.status}],'-',
   ['zoom','',null,null,null,[['normal','Ctrl+RePág',function(){setZoom(1)}],['large','Ctrl+AvPág',function(){setZoom(4)}],['custom','',dZoom],'-',['grid','Ctrl+G',function(){grid=!grid;applyZoom()},function(){return Z>=4},function(){return grid}]]],

];
var mb=$('mb'),openM=null;
function itemHtml(it){
  if(it==='-')return '<div class="sep"></div>';
  if(it[5])return '<div class="sub"><button class="mi">'+esc(S[it[0]])+'</button><div class="menu">'+it[5].map(itemHtml).join('')+'</div></div>';
  return '<button class="mi" data-k="'+it[0]+'">'+esc(S[it[0]])+(it[1]?'<span class="k">'+it[1]+'</span>':'')+'</button>';
}
var ACT={};(function walk(list){list.forEach(function(it){if(it==='-')return;if(it[5])walk(it[5]);else ACT[it[0]]=it})})(M.reduce(function(a,m){return a.concat(m[1])},[]));
mb.innerHTML=M.map(function(m){return '<div data-m="'+m[0]+'"><button>'+esc(S[m[0]])+'</button><div class="menu">'+m[1].map(itemHtml).join('')+'</div></div>'}).join('');
function menuSync(){
  mb.querySelectorAll('.mi[data-k]').forEach(function(b){var it=ACT[b.dataset.k];b.disabled=it[3]?!it[3]():false;b.classList.toggle('on',!!(it[4]&&it[4]()))});
}
function closeMenus(){mb.querySelectorAll('.open').forEach(function(d){d.classList.remove('open')});openM=null}
mb.addEventListener('click',function(e){
  var top=e.target.closest('.mb>div>button');
  if(top){var d=top.parentNode,was=d.classList.contains('open');closeMenus();if(!was){menuSync();d.classList.add('open');openM=d}return}
  var sub=e.target.closest('.sub>.mi');if(sub){sub.parentNode.classList.toggle('open');return}
  var mi=e.target.closest('.mi[data-k]');if(mi&&!mi.disabled){closeMenus();var it=ACT[mi.dataset.k];it[2]&&it[2]()}
});
mb.addEventListener('mouseover',function(e){var top=e.target.closest('.mb>div>button');if(top&&openM&&top.parentNode!==openM){closeMenus();menuSync();top.parentNode.classList.add('open');openM=top.parentNode}});
document.addEventListener('pointerdown',function(e){if(!e.target.closest('.mb'))closeMenus()});
function applyView(){$('tools').classList.toggle('hide',!view.tools);$('cbox').classList.toggle('hide',!view.colors);$('sbar').classList.toggle('hide',!view.status)}
function selAll(){commitAll();setTool('sel');sel={x:0,y:0,w:W,h:H,path:null,fl:null};drawOv();status()}

/* ═════════════ Teclado ═════════════ */
document.addEventListener('keydown',function(e){
  if($('dlgbg').classList.contains('on'))return;
  if(txt&&document.activeElement===txt.el){if(e.key==='Escape'){commitText();e.preventDefault()}return}
  var c=e.ctrlKey||e.metaKey,k=e.key.toLowerCase(),map=null;
  if(c&&e.shiftKey&&k==='n')map='clearimg';
  else if(c)map={n:'new',o:'open',s:'save',p:'print',z:'undo',y:'redo',x:'cut',c:'copy',a:'selall',t:'toolbox',l:'colorbox',g:'grid',f:'thumb',r:'fliprot',w:'stretch',i:'invert',e:'attrs',pageup:'normal',pagedown:'large'}[k];
  else if(e.key==='Delete')map='clearsel';
  else if(e.key==='F1')map='topics';
  else if(e.key==='Escape'){closeMenus();if(down&&down.snap){}if(curve){curveCancel();drawOv()}else if(poly){poly=null;preview=null;drawOv()}else if(sel&&!sel.fl){sel=null;drawOv();status()}return}
  else if(e.key==='Enter'&&poly){polyCommit();return}
  if(k==='v'&&c)return; /* lo gestiona el evento paste */
  if(map&&ACT[map]){var it=ACT[map];if(!it[3]||it[3]()){e.preventDefault();it[2]()}}
});
