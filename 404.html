<script>
(function(){var d=document.documentElement,g=function(k){try{return localStorage.getItem(k)}catch(e){return null}};
var t=g('sf-theme');if(!t){try{t=matchMedia('(prefers-color-scheme: light)').matches?'paper':'night'}catch(e){t='night'}}
d.setAttribute('data-theme',t==='paper'?'paper':'night');d.setAttribute('data-crt',g('sf-crt')==='off'?'off':'on');})();
</script>
<link rel="stylesheet" href="/assets/sf.css">
<style>
.nosignal{display:grid;grid-template-columns:.95fr 1.05fr;gap:56px;align-items:center;min-height:calc(100vh - 68px - 120px);padding-top:56px;padding-bottom:56px}
.snow{animation:snow .35s steps(4) infinite}
@keyframes snow{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
[data-crt="off"] .snow{animation:none}
.badge{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;padding:6px 16px;font:400 clamp(1.6rem,4vw,2.2rem)/1 var(--fc);letter-spacing:.08em;color:#FFF3DA;background:#0B0806;border:2px solid #FFF3DA;white-space:nowrap}
.path{margin-top:10px;color:var(--muted)}
@media (max-width:900px){.nosignal{grid-template-columns:1fr;gap:40px;min-height:0}.nosignal .tv{order:-1}}
</style>
</head>
<body>
<a class="skip" href="#main">Saltar al contenido</a>
<div class="fx scan" aria-hidden="true"></div>
<div class="fx vig" aria-hidden="true"></div>

      <button type="button" class="menu-btn" id="menuBtn" aria-expanded="false" aria-controls="links">MENÚ</button>
    </div>
  </div>

<main id="main">
<div class="wrap nosignal">
  <div>
    <p class="osd crt-txt">ERROR 404 · CANAL VACÍO</p>

      <a class="btn" href="/#proyectos">Ver los proyectos</a>

  </div>
  <div class="tv" aria-hidden="true">
    <div class="screen">
      <svg class="snow" viewBox="0 0 400 300" preserveAspectRatio="xMidYMid slice">
        <filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/></filter>
        <rect x="-40" y="-40" width="480" height="380" filter="url(#n)" opacity=".85"/>
      </svg>
      <div class="track"></div>
      <div class="scr-osd"><span>CH --</span><span>AV 1</span></div>
      <span class="badge">SIN SEÑAL</span>
    </div>
    <div class="tv-foot"><span class="tv-model">SF-2001</span><span class="led"></span><span class="knob"></span><span class="knob"></span></div>
  </div>
</div>
