# Estado en vivo de los proyectos: actualiza assets/data/status.json (último commit, versión y estrellas).
# Corre cada 6 horas, a mano (pestaña Actions → "Estado de los proyectos" → Run workflow) y cuando cambia el script.
name: Estado de los proyectos

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/status.py", ".github/workflows/status.yml"]

permissions:
  contents: write

concurrency:
  group: status-json
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generar status.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/status.py
      - name: Publicar si ha cambiado
        run: |
          if git diff --quiet -- assets/data/status.json && git ls-files --error-unmatch assets/data/status.json >/dev/null 2>&1; then
            echo "Nada que publicar."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/status.json
          git commit -m "Estado de los proyectos: actualizar status.json"
          git push
