<style>
main{display:flex;flex-direction:column;align-items:center;padding:22px 16px 10px}
.head{width:min(560px,100%);display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.head h1{font-size:clamp(2.2rem,6vw,3rem);margin:0}
.head .kick{margin-bottom:8px}
.hud{display:flex;gap:8px}
.hud>span{padding:8px 14px;border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.92),rgba(225,245,255,.7));border:1px solid #fff;box-shadow:0 6px 14px -8px rgba(0,60,130,.6);font:800 12px/1 var(--fd);letter-spacing:.1em;color:var(--muted);text-align:center}
.hud b{display:block;margin-top:4px;font:900 1.5rem/1 var(--fd);color:var(--ph)}
.screen{position:relative;width:min(560px,100%,calc(100svh - 300px));min-width:260px;aspect-ratio:1;padding:12px;border-radius:28px;
  background:linear-gradient(180deg,rgba(255,255,255,.9),rgba(200,235,255,.6));border:1px solid #fff;box-shadow:0 24px 50px -20px rgba(0,50,120,.7),inset 0 1px 0 #fff}
.screen::after{content:"";position:absolute;left:12px;right:12px;top:12px;height:38%;border-radius:18px 18px 50% 50%/18px 18px 30px 30px;background:linear-gradient(180deg,rgba(255,255,255,.13),rgba(255,255,255,0));pointer-events:none}
canvas{display:block;width:100%;height:100%;border-radius:18px;background:#0b2440;touch-action:none;cursor:pointer;box-shadow:inset 0 2px 8px rgba(0,40,90,.4)}
.ov{position:absolute;inset:12px;z-index:2;display:flex;align-items:center;justify-content:center;border-radius:18px;background:rgba(6,24,48,.35);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.ov.show{opacity:1;visibility:visible}
.ov-card{width:min(78%,320px);padding:22px 20px 20px;text-align:center;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(220,242,255,.85));border:1px solid #fff;box-shadow:0 20px 40px -14px rgba(0,30,70,.7),inset 0 1px 0 #fff;transform:translateY(10px) scale(.96);transition:transform .35s cubic-bezier(.2,1.4,.4,1)}
.ov.show .ov-card{transform:none}
.ov-card h2{margin:0 0 6px;font:900 clamp(1.6rem,6vw,2.3rem)/1 var(--fd);background:linear-gradient(180deg,#3cc0ff,#0a6fc0);-webkit-background-clip:text;background-clip:text;color:transparent}
.ov-card p{margin:0 0 16px;color:var(--muted);font:700 .95rem/1.4 var(--fd)}
.ov-card .stats{display:flex;justify-content:center;gap:8px;margin:-4px 0 16px}
.ov-card .stats span{padding:6px 12px;border-radius:12px;background:rgba(10,132,214,.1);font:800 12px/1.2 var(--fd);letter-spacing:.06em;color:var(--muted)}
.ov-card .stats b{display:block;font:900 1.3rem/1 var(--fd);color:var(--ph)}
.ov-card .stats:empty{display:none}
.bar{width:min(560px,100%);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.bar .opts{display:flex;gap:6px;padding:4px;border-radius:999px;background:rgba(255,255,255,.45);border:1px solid #fff}
.tog{min-height:40px;padding:0 16px;border:0;border-radius:999px;background:transparent;color:var(--muted);font:800 13px/1 var(--fd);letter-spacing:.06em;cursor:pointer}
.tog:hover{color:var(--ink);background:rgba(255,255,255,.6)}
.tog[aria-pressed="true"]{color:#fff;background:linear-gradient(180deg,#b9f58a 0,#5fcf2e 48%,#38ad12 52%,#6be03a 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 3px 8px -3px rgba(20,90,0,.7);text-shadow:0 1px 1px rgba(10,60,0,.5)}
.keys{width:min(560px,100%);margin:12px 0 0;padding:8px 14px;border-radius:14px;background:rgba(255,255,255,.5);border:1px solid rgba(255,255,255,.9);color:var(--muted);font:700 13px/1.4 var(--fd);text-align:center}
.pad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:6px;margin-top:14px;user-select:none;-webkit-user-select:none}
.pad button{position:relative;border:1px solid #0a6fb8;border-radius:50%;background:linear-gradient(180deg,#8fe0ff 0,#36b4f2 48%,#0b8ae0 52%,#3cc0ff 100%);color:#fff;font:900 22px/1 var(--fd);touch-action:manipulation;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 6px 12px -6px rgba(0,60,130,.8);text-shadow:0 1px 1px rgba(0,50,110,.6)}
.pad button:active{filter:brightness(.9)}
.pad .u{grid-area:1/2}.pad .l{grid-area:2/1}.pad .c{grid-area:2/2;font-size:15px;background:linear-gradient(180deg,#fff,#d9eefc);color:var(--muted);border-color:#9cc8e8;text-shadow:none}.pad .r{grid-area:2/3}.pad .d{grid-area:3/2}
@media(pointer:coarse),(hover:none){.pad{display:grid;grid-template-columns:repeat(3,54px);grid-template-rows:repeat(3,54px);gap:4px;margin-top:8px}.keys{display:none}.head .kick{display:none}.head{align-items:center;margin-bottom:8px}.head h1{font-size:2rem}.hud>span{padding:6px 12px}.hud b{font-size:1.2rem}.screen{width:min(560px,100%,calc(100svh - 395px));min-width:240px;padding:8px}.screen::after{left:8px;right:8px;top:8px}main{padding-top:10px}.bar{margin-top:8px}}
@media(pointer:fine) and (hover:hover){.keys .tc{display:none}}
</style>
